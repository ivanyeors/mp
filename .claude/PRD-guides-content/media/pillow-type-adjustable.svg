.sp{stroke-width:3;fill:none;stroke-linecap:round}.face{fill:none;stroke:#7d8796;stroke-width:2}
.fill{fill:#2f6db5;opacity:.55}.line{fill:none;stroke:#2f6db5;stroke-width:2}.acc{fill:none;stroke:#d9661f;stroke-width:2.5;stroke-linecap:round}
