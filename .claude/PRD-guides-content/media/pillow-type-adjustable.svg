<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img"><title>Adjustable pillow: loose fill you add or remove to change the height</title><style>
.mat{fill:#e6e9ee}.body{fill:#d5dbe3}.neck{stroke:#d5dbe3;stroke-width:24;stroke-linecap:round;fill:none}
