name: ci

# One gate per pull request: lint, typecheck, the checks and the test suite, as
# jobs that run side by side. `verify` is the required check: it passes only
# when every part it needs passed.
#
# Until November 2026 all of it ran in one job, one step after another: 13 to
# 19 minutes. Each GitHub runner here has two vCPUs that behave like one core
# (PR #476 measured two Vitest workers at half speed each), so more workers on
# one runner do not help; more runners do. The suite now runs as two shards on
# two runners, beside lint and typecheck on their own runners. And
# .claude/hooks/verify.test.ts, which runs the real ESLint many times to test
# the editing hook and was 3 to 4 minutes of every run, now runs in its own
# job, only when something it tests changed (see Scope). The first complete
# run of this layout took 3 min 55 s from start to verify (PR #479).
#
# The production build and type-safety are gated by Vercel, not here: Vercel
# builds a preview for every pull request and builds production on deploy, so a
# build that does not compile (and `next build` type-checks, so a type error
# too) never reaches production. Running `next build` again in Actions only
# duplicates that and burns minutes. What Vercel does NOT run is the test suite,
# so that is the gate this workflow adds.
#
# Pull-request only: the required checks pass on the PR's merge commit before it
# can merge, and Vercel rebuilds main on deploy, so re-running on push to main
# would add minutes without adding a gate.
#
# Paused for minutes: once the account has used CI_PAUSE_AT_MINUTES of the
# month's Actions minutes (scripts/actions-minutes.mjs), Scope says nothing is
# in scope, so lint, typecheck, tests and checks skip and verify passes with a
# warning, and pull requests stay mergeable by hand instead of waiting on a job
# GitHub will not start. The unverified job then marks the head so auto-merge
# does not merge it.

on:
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The token's rights, stated rather than inherited: the repository's default
# grants contents only, and gitleaks reads the pull request's commits through
# the API (GET /pulls/{n}/commits), which answered 403 without
# `pull-requests: read` and failed every run at the Secret scan step.
permissions:
  contents: read
  pull-requests: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      hooks: ${{ steps.scope.outputs.hooks }}
      paused: ${{ steps.minutes.outputs.pause }}

    steps:
      # Full history for gitleaks, but without old file contents: those are
      # mostly past copies of graphify-out/graph.json (30 MB each), and a full
      # clone took a minute of every run. Git fetches the contents gitleaks
      # needs, for this pull request's own commits, when it reads them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # Plain node from the runner image: this runs before any install.
      # Without the ACTIONS_BILLING_TOKEN secret it reads nothing and CI runs
      # in full.
      - name: Actions minutes
        id: minutes
        env:
          BILLING_TOKEN: ${{ secrets.ACTIONS_BILLING_TOKEN }}
          PAUSE_AT: ${{ vars.CI_PAUSE_AT_MINUTES }}
          OWNER: ${{ github.repository_owner }}
        run: node scripts/actions-minutes.mjs

      # A pull request that changes only Markdown nothing tests (PRDs, ADRs,
      # notes) skips install, lint, typecheck, tests and checks: about ten
      # minutes saved, and verify still reports, so the required check passes.
      # A Markdown file counts as code when any test or check names it, since
      # some read CONTEXT.md, ADRs and docs/marketing-page/ directly.
      #
      # The hook tests run only when a file they exercise changed: the hooks,
      # the ESLint config and rules they run for real, the pre-commit hook and
      # lint-baseline.mjs they copy and run, the checks runner the stop hook
      # calls, or the installed packages. scripts/ci-workflow.test.ts fails if
      # verify.test.ts reads a file from the checkout that this list misses.
      #
      # Paused for minutes, everything is out of scope.
      - name: Scope
        id: scope
        env:
          PAUSED: ${{ steps.minutes.outputs.pause }}
        run: |
          if [ "$PAUSED" = true ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "hooks=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything unexpected (no diff, a failed git command) runs everything.
          if ! files="$(git diff --name-only HEAD^1 HEAD)" || [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "hooks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          hooks=false
          while IFS= read -r f; do
            case "$f" in
              *.md)
                if git grep -q -F "$(basename "$f")" -- '*.test.ts' '*.test.tsx' '*.check.ts'; then
                  echo "$f is read by a test or check"
                  code=true
                fi
                ;;
              *) code=true ;;
            esac
            case "$f" in
              .claude/hooks/*|eslint.config.*|eslint-rules/*|.githooks/*|scripts/lint-baseline.mjs|scripts/checks.mjs|package.json|pnpm-lock.yaml|.npmrc)
                echo "$f is exercised by the hook tests"
                hooks=true
                ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "hooks=$hooks" >> "$GITHUB_OUTPUT"
          [ "$code" = true ] || echo "::notice title=Docs only::Only Markdown that no test reads changed; skipping install, lint, typecheck, tests and checks."

      # Fails the PR when any of its commits adds a credential.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A finding fails this step and is listed in the job summary. Commenting
          # it on the pull request would need `pull-requests: write`, which this
          # job does not get.
          GITLEAKS_ENABLE_COMMENTS: "false"

  lint:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # corepack pins pnpm from package.json's `packageManager` field, so the
      # version here can never drift from the one the lockfile was written with.
      # It must be enabled before setup-node, which resolves `pnpm` for its cache.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Single-threaded on purpose: on this runner --concurrency=2 took 2:43
      # against 2:12 (PR #476, November 2026). Most of the time is the React
      # Compiler rules, which are worth keeping.
      - name: Lint
        run: pnpm lint

  types:
    name: types and checks
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm typecheck` runs `next typegen` first: next-env.d.ts and
      # .next/types/** are gitignored build artefacts that tsconfig.json
      # includes, so a fresh checkout has no route types without it.
      #
      # tsc needs about 2.3 GB for the whole program, past Node's default
      # ~2 GB heap on this runner, which ends in "JavaScript heap out of
      # memory".
      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # The `*.check.ts` invariant scripts. Before this step nothing ran them,
      # and eleven had drifted from the code unnoticed. The few that need a
      # live database are skipped here (see LIVE in scripts/checks.mjs).
      - name: Checks
        run: pnpm checks

  # The suite in two halves on two runners. Each half pays its own install,
  # about half a minute.
  test:
    name: tests (${{ matrix.shard }}/2)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      # Full history, without old file contents, as in scope:
      # scripts/lint-baseline.test.ts compares against the repository's first
      # commit, which a shallow clone does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One worker, Vitest's default on two vCPUs, on purpose: with two the
      # run's total test work doubled (import 149 s to 327 s, tests 386 s to
      # 643 s), so each worker ran at half speed, the step saved 39 s, and
      # two CPU-heavy email tests passed their 5 s limit (PR #476, November
      # 2026). PR #479's shards with two workers showed the same: loading 411
      # files took 152 s, about what one worker took for all 805.
      #
      # --silent=passed-only keeps console output from failing tests only: a
      # passing run printed about 360 blocks of expected error logging, which
      # buried the one that mattered.
      - name: Test
        run: >-
          pnpm exec vitest run
          --shard=${{ matrix.shard }}/2
          --exclude .claude/hooks/verify.test.ts
          --silent=passed-only

  hooks:
    name: hook tests
    needs: scope
    if: needs.scope.outputs.hooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Hook tests
        run: pnpm exec vitest run .claude/hooks/verify.test.ts --silent=passed-only

  # Paused for minutes, verify succeeds without verifying anything. This puts
  # an action_required check on the head, which says so on the pull request
  # and which auto-merge refuses (scripts/pr-risk.mjs merges only when every
  # check other than verify passed). Its own job so the write token never
  # shares a runner with pull request code; it costs a minute only when paused.
  unverified:
    needs: scope
    if: needs.scope.outputs.paused == 'true'
    # One CPU at a third of the 2-core price, for a job that takes seconds.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      checks: write

    steps:
      - name: Mark this head unverified
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/check-runs" --method POST \
            -f name="CI paused: Actions minutes" \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion=action_required \
            -f details_url="$RUN_URL" \
            -f "output[title]=Lint, typecheck, tests and checks did not run" \
            -f "output[summary]=This month's Actions minutes reached CI_PAUSE_AT_MINUTES, so CI skipped this head. Merge by hand only if you accept that; auto-merge will not merge it. Push again after the 1st (UTC), or raise CI_PAUSE_AT_MINUTES, to run CI in full." \
            > /dev/null

  # The required check (REQUIRED_CHECKS in scripts/pr-risk.mjs, and branch
  # protection). It runs even when a part failed or the run was cancelled, so
  # that it fails then: a skipped required check counts as passed. Each part
  # must have succeeded, except one Scope said was not needed. Paused for
  # minutes, it passes only once the head is marked unverified, so auto-merge
  # cannot take a head nothing checked.
  verify:
    needs: [scope, lint, types, test, hooks, unverified]
    if: always()
    # One CPU at a third of the 2-core price: it only reads the results.
    runs-on: ubuntu-slim
    timeout-minutes: 2

    steps:
      - name: Every part passed
        env:
          SCOPE: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          HOOKS: ${{ needs.scope.outputs.hooks }}
          PAUSED: ${{ needs.scope.outputs.paused }}
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.types.result }}
          TEST: ${{ needs.test.result }}
          HOOK_TESTS: ${{ needs.hooks.result }}
          UNVERIFIED: ${{ needs.unverified.result }}
        run: |
          failed=0
          need() {
            if [ "$2" = success ]; then echo "$1: success"
            else echo "::error title=$1 did not pass::$1 ended ${2:-without a result}."; failed=1; fi
          }
          need "scope and secret scan" "$SCOPE"
          if [ "$PAUSED" = true ]; then
            echo "::warning title=CI paused for Actions minutes::Lint, typecheck, tests and checks did not run on this head."
            need "the unverified mark" "$UNVERIFIED"
          elif [ "$CODE" = true ]; then
            need "lint" "$LINT"
            need "types and checks" "$TYPES"
            need "tests" "$TEST"
          else
            echo "Docs only: lint, types, checks and tests were not needed."
          fi
          if [ "$HOOKS" = true ]; then need "hook tests" "$HOOK_TESTS"
          else echo "hook tests: not needed, nothing they exercise changed."; fi
          exit "$failed"
