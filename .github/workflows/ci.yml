name: ci

# One lean gate per pull request: lint, typecheck, and the test suite, in a
# single job that installs dependencies once.
#
# The production build and type-safety are gated by Vercel, not here: Vercel
# builds a preview for every pull request and builds production on deploy, so a
# build that does not compile (and `next build` type-checks, so a type error
# too) never reaches production. Running `next build` again in Actions only
# duplicates that and burns minutes. What Vercel does NOT run is the test suite,
# so that is the gate this workflow adds.
#
# Pull-request only: the required checks pass on the PR's merge commit before it
# can merge, and Vercel rebuilds main on deploy, so re-running on push to main
# would add minutes without adding a gate.

on:
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # corepack pins pnpm from package.json's `packageManager` field, so the
      # version here can never drift from the one the lockfile was written with.
      # It must be enabled before setup-node, which resolves `pnpm` for its cache.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm typecheck` runs `next typegen` first: next-env.d.ts and
      # .next/types/** are gitignored build artefacts that tsconfig.json
      # includes, so a fresh checkout has no route types without it.
      #
      # tsc needs about 2.3 GB for the whole program, past Node's default
      # ~2 GB heap on this runner, which ends in "JavaScript heap out of
      # memory".
      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test
        run: pnpm test
