name: graphify freshness

# The knowledge graph in graphify-out/ is committed so agents and fresh clones
# have it available immediately. That only works if it tracks the code: a stale
# graph is worse than no graph, because it reports confident line numbers that
# have since moved. This job rebuilds the graph and fails if the committed one
# does not match the current source.
#
# Previously this drifted 176 commits behind, so the guard is the mechanism —
# not a reminder to refresh by hand.

on:
  pull_request:
  push:
    branches: [main]

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: graphify-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Official installer rather than a third-party action, so this workflow
      # has no action version to drift. uvx fetches the graphify version
      # pinned in scripts/graphify.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Record digest of the committed graph
        id: committed
        run: echo "digest=$(./scripts/graphify-digest.py graphify-out/graph.json)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the graph from current source
        run: ./scripts/graphify update .

      - name: Compare
        run: |
          committed='${{ steps.committed.outputs.digest }}'
          rebuilt="$(./scripts/graphify-digest.py graphify-out/graph.json)"

          echo "committed: $committed"
          echo "rebuilt:   $rebuilt"

          if [ "$committed" = "$rebuilt" ]; then
            echo "Graph is current."
            exit 0
          fi

          cat <<'MSG'

          ---------------------------------------------------------------
          The committed knowledge graph does not match the source tree.

          Code was changed without refreshing graphify-out/. Agents reading
          the graph would be given stale file locations.

          Fix, from the repo root:

              ./scripts/graphify update .
              git add graphify-out/
              git commit --amend --no-edit    # or a new commit

          This compares node and edge structure only. Community assignment
          is not reproducible between runs and is deliberately excluded, so
          this failure means the source really did change.
          ---------------------------------------------------------------
          MSG
          exit 1
