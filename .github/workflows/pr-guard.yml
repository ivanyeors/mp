name: pr guard

# Says loudly when a pull request can't be merged, and points out when another
# open pull request is already changing the same files.
#
# ci.yml triggers on `pull_request`, and GitHub builds those runs against a
# merge commit of the branch and its base. When a pull request conflicts with
# `main`, that merge commit cannot be created, so ci.yml does not fail — it
# never starts. The pull request sits with no checks at all, which on the
# Checks tab is indistinguishable from checks still running. #190 sat like that
# for forty minutes while `main` moved underneath it.
#
# `pull_request_target` runs against the base branch, so it needs no merge
# commit and always runs: when a pull request is opened or reopened, and on
# every push to its branch (`synchronize`). It is safe only because nothing
# below checks out or executes branch code; it reads the API and nothing else.
#
# This used to run on every branch push as well. That doubled every push to a
# pull request's branch (push and synchronize both fired) and ran on branches
# with no pull request, where it could only say "nothing to guard": 38 of the
# 61 runs in two days in November 2026. The base moving under an open pull
# request fires nothing here; pr-sweep.yml finds those.
#
# Deliberately cheap: no checkout, no install, no build.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  # Keyed by pull request: under pull_request_target `github.ref` is the BASE
  # branch, so a ref-keyed group would let one pull request's run cancel
  # another's.
  group: pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    # A pinned image, not ubuntu-latest: these jobs need only bash and gh, and
    # the label's move to Ubuntu 26 put a notice on every run.
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Resolve the pull request and the head it describes
        id: pr
        run: |
          echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Fail if the pull request cannot be merged
        run: |
          pr='${{ steps.pr.outputs.number }}'
          want='${{ steps.pr.outputs.head }}'

          # Two things have to be true before a verdict is worth anything:
          # GitHub has finished computing mergeability (it reports UNKNOWN until
          # then), and the answer describes the head this run is about. Reading
          # only `mergeable` would accept a CONFLICTING left over from the
          # previous head and fail a push that just resolved the conflict —
          # with nothing scheduled to re-run and clear it.
          state="UNKNOWN"
          for _ in 1 2 3 4 5 6; do
            answer="$(gh pr view "$pr" --json mergeable,headRefOid \
              --jq '.mergeable + " " + .headRefOid')"
            state="${answer%% *}"
            got="${answer##* }"
            [ "$state" != "UNKNOWN" ] && [ "$got" = "$want" ] && break
            state="UNKNOWN"
            sleep 5
          done

          echo "mergeable: $state (head $want)"

          if [ "$state" != "CONFLICTING" ]; then
            # UNKNOWN after 30s is not a conflict — GitHub is still thinking, or
            # the head moved again. Failing on it would cry wolf.
            exit 0
          fi

          base="$(gh pr view "$pr" --json baseRefName --jq .baseRefName)"

          # The annotation is what the pull request and the run summary show;
          # without it they say only "exit code 1" and the reason is in the log.
          echo "::error title=Pull request #$pr conflicts with $base::Merge $base into this branch and push. Until then ci.yml cannot run, so this pull request has no real checks."

          cat <<MSG

          ---------------------------------------------------------------
          Pull request #$pr conflicts with $base.

          This is not only a merge problem. ci.yml runs against a merge commit of this branch and $base, and GitHub
          cannot build one while the conflict stands — so ci.yml is
          not failing, it is not running at all. Lint, typecheck, test and
          build have not seen this code, and the pull request shows no checks
          rather than red ones.

          Fix, from the repo root:

              git fetch origin $base
              git merge origin/$base
              # resolve; for graphify-out/ take main's copy:
              git checkout origin/$base -- graphify-out/
              git add -A && git commit
              git push

          The real checks start again on the next push.
          ---------------------------------------------------------------
          MSG
          exit 1

      - name: Warn about files another open pull request is also changing
        run: |
          pr='${{ steps.pr.outputs.number }}'

          # graphify-out/ is generated, and a refresh rewrites all of it, so a
          # pull request that refreshes it overlaps every other one there.
          # Counting it would make this warning mean nothing.
          # `gh pr view --json files` silently caps at 100 and does not
          # paginate; a large refactor would under-report its own overlap.
          mine="$(gh api --paginate "repos/$GH_REPO/pulls/$pr/files" --jq '.[].path' \
            | grep -v '^graphify-out/' | sort || true)"

          if [ -z "$mine" ]; then
            echo "No non-generated files changed."
            exit 0
          fi

          others="$(gh pr list --state open --limit 100 --json number \
            --jq ".[] | select(.number != $pr) | .number")"

          if [ -z "$others" ]; then
            echo "No other open pull requests."
            exit 0
          fi

          found=0
          for other in $others; do
            theirs="$(gh api --paginate "repos/$GH_REPO/pulls/$other/files" --jq '.[].path' \
              | grep -v '^graphify-out/' | sort || true)"
            [ -z "$theirs" ] && continue

            overlap="$(comm -12 <(printf '%s\n' "$mine") <(printf '%s\n' "$theirs"))"
            [ -z "$overlap" ] && continue

            found=1
            title="$(gh pr view "$other" --json title --jq .title)"
            # A notice, never a failure. Two pull requests touching one file is
            # normal; being surprised by it at merge time is what is not.
            {
              echo "::warning title=Also being changed by #$other::$title"
              echo "$overlap" | sed 's/^/  /'
            }
          done

          if [ "$found" = "0" ]; then
            echo "No overlap with other open pull requests."
          else
            cat <<'MSG'

          ---------------------------------------------------------------
          Another open pull request is changing files this one changes.

          Not a failure — but whichever merges second will have to merge the
          first, and a clean auto-merge is not proof of a correct one. Two
          branches can each be right and still leave the result wrong: in
          #190 the other side added a payment email after this side had given
          every payment email a cancel link, and git had no way to see it.

          Read the other pull request before merging, not after.
          ---------------------------------------------------------------
          MSG
          fi
