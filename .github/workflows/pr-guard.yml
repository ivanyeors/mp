name: pr guard

# Runs on a BRANCH PUSH, on purpose, and that is the whole point of it.
#
# ci.yml and graphify-freshness.yml both trigger on `pull_request`, and GitHub
# builds those runs against a merge commit of the branch and its base. When a
# pull request conflicts with `main`, that merge commit cannot be created, so
# those workflows do not fail — they never start. The pull request sits with no
# checks at all, which on the Checks tab is indistinguishable from checks that
# are still running. #190 sat like that for forty minutes while `main` moved
# underneath it, and nothing on the page said so.
#
# A `push` run does not need a merge commit, so this one always runs. Two jobs
# in one: say loudly when a pull request cannot be merged, and point out when
# another open pull request is already changing the same files. The second
# matters here because several agent sessions work this repository at once —
# #190 and #191 were open together and both rewrote the same email module.
#
# Deliberately cheap: no checkout, no install, no build. It exists to make a
# silent pull request impossible, not to re-run the test suite.

on:
  push:
    branches-ignore: [main]

concurrency:
  group: pr-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Find the pull request for this branch
        id: pr
        run: |
          number="$(gh pr list --head "$GITHUB_REF_NAME" --state open \
            --json number --jq '.[0].number // empty')"

          if [ -z "$number" ]; then
            echo "No open pull request for $GITHUB_REF_NAME — nothing to guard yet."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Guarding pull request #$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Fail if the pull request cannot be merged
        if: steps.pr.outputs.number != ''
        run: |
          pr='${{ steps.pr.outputs.number }}'

          # GitHub computes mergeability asynchronously and reports UNKNOWN
          # until it has. Polling rather than trusting the first read, which
          # right after a push is very often UNKNOWN.
          state="UNKNOWN"
          for _ in 1 2 3 4 5 6; do
            state="$(gh pr view "$pr" --json mergeable --jq .mergeable)"
            [ "$state" != "UNKNOWN" ] && break
            sleep 5
          done

          echo "mergeable: $state"

          if [ "$state" != "CONFLICTING" ]; then
            # UNKNOWN after 30s is not a conflict — GitHub is still thinking,
            # and failing on it would cry wolf on every busy push.
            exit 0
          fi

          base="$(gh pr view "$pr" --json baseRefName --jq .baseRefName)"

          cat <<MSG

          ---------------------------------------------------------------
          Pull request #$pr conflicts with $base.

          This is not only a merge problem. ci.yml and graphify-freshness.yml
          run against a merge commit of this branch and $base, and GitHub
          cannot build one while the conflict stands — so those workflows are
          not failing, they are not running at all. Lint, typecheck, test and
          build have not seen this code, and the pull request shows no checks
          rather than red ones.

          Fix, from the repo root:

              git fetch origin $base
              git merge origin/$base
              # resolve, then regenerate rather than hand-merge graphify-out/:
              ./scripts/graphify update .
              git add -A && git commit
              git push

          The real checks start again on the next push.
          ---------------------------------------------------------------
          MSG
          exit 1

      - name: Warn about files another open pull request is also changing
        if: steps.pr.outputs.number != ''
        run: |
          pr='${{ steps.pr.outputs.number }}'

          # graphify-out/ is regenerated by every change that touches code, so
          # every pair of open pull requests overlaps there. Including it would
          # make this warning fire always and mean nothing.
          mine="$(gh pr view "$pr" --json files --jq '.files[].path' \
            | grep -v '^graphify-out/' | sort || true)"

          if [ -z "$mine" ]; then
            echo "No non-generated files changed."
            exit 0
          fi

          others="$(gh pr list --state open --json number \
            --jq ".[] | select(.number != $pr) | .number")"

          if [ -z "$others" ]; then
            echo "No other open pull requests."
            exit 0
          fi

          found=0
          for other in $others; do
            theirs="$(gh pr view "$other" --json files --jq '.files[].path' \
              | grep -v '^graphify-out/' | sort || true)"
            [ -z "$theirs" ] && continue

            overlap="$(comm -12 <(printf '%s\n' "$mine") <(printf '%s\n' "$theirs"))"
            [ -z "$overlap" ] && continue

            found=1
            title="$(gh pr view "$other" --json title --jq .title)"
            # A notice, never a failure. Two pull requests touching one file is
            # normal; being surprised by it at merge time is what is not.
            {
              echo "::warning title=Also being changed by #$other::$title"
              echo "$overlap" | sed 's/^/  /'
            }
          done

          if [ "$found" = "0" ]; then
            echo "No overlap with other open pull requests."
          else
            cat <<'MSG'

          ---------------------------------------------------------------
          Another open pull request is changing files this one changes.

          Not a failure — but whichever merges second will have to merge the
          first, and a clean auto-merge is not proof of a correct one. Two
          branches can each be right and still leave the result wrong: in
          #190 the other side added a payment email after this side had given
          every payment email a cancel link, and git had no way to see it.

          Read the other pull request before merging, not after.
          ---------------------------------------------------------------
          MSG
          fi
