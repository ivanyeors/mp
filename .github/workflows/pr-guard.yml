name: pr guard

# Runs on a BRANCH PUSH, on purpose, and that is the whole point of it.
#
# ci.yml and graphify-freshness.yml both trigger on `pull_request`, and GitHub
# builds those runs against a merge commit of the branch and its base. When a
# pull request conflicts with `main`, that merge commit cannot be created, so
# those workflows do not fail — they never start. The pull request sits with no
# checks at all, which on the Checks tab is indistinguishable from checks that
# are still running. #190 sat like that for forty minutes while `main` moved
# underneath it, and nothing on the page said so.
#
# A `push` run does not need a merge commit, so this one always runs. Two jobs
# in one: say loudly when a pull request cannot be merged, and point out when
# another open pull request is already changing the same files. The second
# matters here because several agent sessions work this repository at once —
# #190 and #191 were open together and both rewrote the same email module.
#
# Three triggers, because no single one covers the failure.
#
#   push                  immediate word on your own pushes.
#   pull_request_target   a pull request opened AFTER its branch was pushed —
#                         the usual order — gets no push event, so a push-only
#                         guard would never see a pull request born conflicting.
#                         This event runs against the base branch and so needs
#                         no merge commit either. It is safe here only because
#                         nothing below checks out or executes branch code; it
#                         reads the API and nothing else.
#   schedule              nothing fires on a pull request when its BASE moves,
#                         which is how #190 became conflicted. The sweep finds
#                         those and fails, which mails whoever owns the repo.
#
# Deliberately cheap: no checkout, no install, no build. It exists to make a
# silent pull request impossible, not to re-run the test suite.

on:
  push:
    branches-ignore: [main]
  pull_request_target:
    types: [opened, reopened, synchronize]
  schedule:
    # Every three hours. Fast enough that a conflict born from a merge is found
    # the same working session, cheap enough to be invisible.
    - cron: "0 */3 * * *"

concurrency:
  group: pr-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Resolve the pull request and the head it describes
        id: pr
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            number='${{ github.event.pull_request.number }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            number="$(gh pr list --head "$GITHUB_REF_NAME" --state open --limit 100 \
              --json number --jq '.[0].number // empty')"
            head="$GITHUB_SHA"
          fi

          if [ -z "$number" ]; then
            echo "No open pull request for $GITHUB_REF_NAME yet."
            echo "Opening one fires pull_request_target, which guards it then."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Guarding pull request #$number at $head"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Fail if the pull request cannot be merged
        if: steps.pr.outputs.number != ''
        run: |
          pr='${{ steps.pr.outputs.number }}'
          want='${{ steps.pr.outputs.head }}'

          # Two things have to be true before a verdict is worth anything:
          # GitHub has finished computing mergeability (it reports UNKNOWN until
          # then), and the answer describes the head this run is about. Reading
          # only `mergeable` would accept a CONFLICTING left over from the
          # previous head and fail a push that just resolved the conflict —
          # with nothing scheduled to re-run and clear it.
          state="UNKNOWN"
          for _ in 1 2 3 4 5 6; do
            answer="$(gh pr view "$pr" --json mergeable,headRefOid \
              --jq '.mergeable + " " + .headRefOid')"
            state="${answer%% *}"
            got="${answer##* }"
            [ "$state" != "UNKNOWN" ] && [ "$got" = "$want" ] && break
            state="UNKNOWN"
            sleep 5
          done

          echo "mergeable: $state (head $want)"

          if [ "$state" != "CONFLICTING" ]; then
            # UNKNOWN after 30s is not a conflict — GitHub is still thinking, or
            # the head moved again. Failing on it would cry wolf.
            exit 0
          fi

          base="$(gh pr view "$pr" --json baseRefName --jq .baseRefName)"

          cat <<MSG

          ---------------------------------------------------------------
          Pull request #$pr conflicts with $base.

          This is not only a merge problem. ci.yml and graphify-freshness.yml
          run against a merge commit of this branch and $base, and GitHub
          cannot build one while the conflict stands — so those workflows are
          not failing, they are not running at all. Lint, typecheck, test and
          build have not seen this code, and the pull request shows no checks
          rather than red ones.

          Fix, from the repo root:

              git fetch origin $base
              git merge origin/$base
              # resolve, then regenerate rather than hand-merge graphify-out/:
              ./scripts/graphify update .
              git add -A && git commit
              git push

          The real checks start again on the next push.
          ---------------------------------------------------------------
          MSG
          exit 1

      - name: Warn about files another open pull request is also changing
        if: steps.pr.outputs.number != ''
        run: |
          pr='${{ steps.pr.outputs.number }}'

          # graphify-out/ is regenerated by every change that touches code, so
          # every pair of open pull requests overlaps there. Including it would
          # make this warning fire always and mean nothing.
          # `gh pr view --json files` silently caps at 100 and does not
           # paginate; a large refactor would under-report its own overlap.
          mine="$(gh api --paginate "repos/$GH_REPO/pulls/$pr/files" --jq '.[].path' \
            | grep -v '^graphify-out/' | sort || true)"

          if [ -z "$mine" ]; then
            echo "No non-generated files changed."
            exit 0
          fi

          others="$(gh pr list --state open --limit 100 --json number \
            --jq ".[] | select(.number != $pr) | .number")"

          if [ -z "$others" ]; then
            echo "No other open pull requests."
            exit 0
          fi

          found=0
          for other in $others; do
            theirs="$(gh api --paginate "repos/$GH_REPO/pulls/$other/files" --jq '.[].path' \
              | grep -v '^graphify-out/' | sort || true)"
            [ -z "$theirs" ] && continue

            overlap="$(comm -12 <(printf '%s\n' "$mine") <(printf '%s\n' "$theirs"))"
            [ -z "$overlap" ] && continue

            found=1
            title="$(gh pr view "$other" --json title --jq .title)"
            # A notice, never a failure. Two pull requests touching one file is
            # normal; being surprised by it at merge time is what is not.
            {
              echo "::warning title=Also being changed by #$other::$title"
              echo "$overlap" | sed 's/^/  /'
            }
          done

          if [ "$found" = "0" ]; then
            echo "No overlap with other open pull requests."
          else
            cat <<'MSG'

          ---------------------------------------------------------------
          Another open pull request is changing files this one changes.

          Not a failure — but whichever merges second will have to merge the
          first, and a clean auto-merge is not proof of a correct one. Two
          branches can each be right and still leave the result wrong: in
          #190 the other side added a payment email after this side had given
          every payment email a cancel link, and git had no way to see it.

          Read the other pull request before merging, not after.
          ---------------------------------------------------------------
          MSG
          fi

  sweep:
    # Nothing fires on a pull request when its base moves, so the only way to
    # notice is to go and look. A failing scheduled run mails the repository
    # owner, which is why this fails rather than logging politely.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Report open pull requests that can no longer be merged
        run: |
          conflicting=""

          for pr in $(gh pr list --state open --limit 100 --json number --jq '.[].number'); do
            state="$(gh pr view "$pr" --json mergeable --jq .mergeable)"
            echo "#$pr: $state"
            [ "$state" = "CONFLICTING" ] && conflicting="$conflicting $pr"
          done

          if [ -z "$conflicting" ]; then
            echo "Every open pull request can still be merged."
            exit 0
          fi

          cat <<MSG

          ---------------------------------------------------------------
          Open pull requests that can no longer be merged:$conflicting

          Their branches have not changed — main moved underneath them. While
          this stands, ci.yml and graphify-freshness.yml cannot run on them at
          all, so whatever checks they last showed describe older code.

          Each one needs its base merged in and pushed.
          ---------------------------------------------------------------
          MSG
          exit 1
